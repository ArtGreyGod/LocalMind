name: Build LocalMind Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36.1, NDK 28.2, and CMake 3.30.3
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.30.3"

      # glslc is required on the build host to precompile ggml-vulkan shaders so the
      # APK ships real Vulkan GPU offloading. CMake degrades to CPU-only without it.
      - name: Install glslc (Vulkan shader compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc || sudo apt-get install -y shaderc-tools || true
          command -v glslc && glslc --version || echo "WARNING: glslc unavailable; Vulkan offload will be disabled in this build"

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK (Kotlin + C++17 llama.cpp NDK, Vulkan GPU offload)
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK with readable name
        run: cp app/build/outputs/apk/debug/app-debug.apk LocalMind-arm64-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalMind-arm64-debug-apk
          path: LocalMind-arm64-debug.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalMind-arm64-debug.apk
